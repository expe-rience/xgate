<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="600" y="46" fill="#e6edf3" font-size="26" font-weight="700" text-anchor="middle">xgate — the AI-agent execution boundary</text>
  <text x="600" y="74" fill="#7d8590" font-size="15" text-anchor="middle">policy decides · a scoped short-lived capability is minted · the daemon enforces it · it expires</text>

  <!-- AGENT -->
  <rect x="60" y="130" width="230" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="175" y="170" fill="#e6edf3" font-size="19" font-weight="600" text-anchor="middle">AI agent</text>
  <text x="175" y="198" fill="#7d8590" font-size="13" text-anchor="middle">wants to act on a</text>
  <text x="175" y="216" fill="#7d8590" font-size="13" text-anchor="middle">real machine</text>
  <text x="175" y="238" fill="#58a6ff" font-size="12" text-anchor="middle">holds NO standing key</text>

  <!-- POLICY ENGINE -->
  <rect x="440" y="110" width="300" height="220" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="590" y="146" fill="#e6edf3" font-size="19" font-weight="600" text-anchor="middle">policy engine (xgate-policy)</text>
  <line x1="470" y1="162" x2="710" y2="162" stroke="#30363d"/>
  <text x="470" y="190" fill="#7d8590" font-size="14">Evaluates the request:</text>
  <text x="480" y="216" fill="#c9d1d9" font-size="13">• WHO is the agent?</text>
  <text x="480" y="240" fill="#c9d1d9" font-size="13">• WHAT action + resource?</text>
  <text x="480" y="264" fill="#c9d1d9" font-size="13">• Is it in policy? (default-deny)</text>
  <text x="480" y="288" fill="#c9d1d9" font-size="13">• HOW long / how many uses?</text>
  <text x="590" y="316" fill="#8b949e" font-size="12" font-style="italic" text-anchor="middle">the decision point</text>

  <!-- CAP (granted path) -->
  <rect x="440" y="410" width="300" height="120" rx="10" fill="#0f2417" stroke="#3fb950" stroke-width="2"/>
  <text x="590" y="446" fill="#3fb950" font-size="17" font-weight="600" text-anchor="middle">✓ GRANT → scoped capability</text>
  <text x="590" y="474" fill="#c9d1d9" font-size="13" text-anchor="middle">a signed certificate carrying:</text>
  <text x="590" y="497" fill="#e6edf3" font-size="13" text-anchor="middle" font-family="monospace">exec:/usr/local/bin/deploy · 60s · 1 use</text>
  <text x="590" y="518" fill="#8b949e" font-size="12" text-anchor="middle">nothing else, expires automatically</text>

  <!-- DENY path -->
  <rect x="820" y="150" width="320" height="140" rx="10" fill="#2d0f0f" stroke="#f85149" stroke-width="2"/>
  <text x="980" y="186" fill="#f85149" font-size="17" font-weight="600" text-anchor="middle">✗ DENY</text>
  <text x="980" y="214" fill="#c9d1d9" font-size="13" text-anchor="middle">request outside policy</text>
  <text x="980" y="236" fill="#c9d1d9" font-size="13" text-anchor="middle">(e.g. read prod DB creds,</text>
  <text x="980" y="256" fill="#c9d1d9" font-size="13" text-anchor="middle">open a shell)</text>
  <text x="980" y="280" fill="#f0a0a0" font-size="12" text-anchor="middle" font-weight="600">no capability is ever minted</text>

  <!-- ENFORCEMENT -->
  <rect x="440" y="620" width="300" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="590" y="656" fill="#e6edf3" font-size="19" font-weight="600" text-anchor="middle">xgated (enforcement)</text>
  <line x1="470" y1="672" x2="710" y2="672" stroke="#30363d"/>
  <text x="480" y="700" fill="#c9d1d9" font-size="13">• verifies the cert (CA-signed)</text>
  <text x="480" y="724" fill="#c9d1d9" font-size="13">• runs EXACTLY the one command</text>
  <text x="480" y="748" fill="#c9d1d9" font-size="13">• refuses anything outside the cap</text>

  <!-- TARGET -->
  <rect x="820" y="635" width="320" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="980" y="672" fill="#e6edf3" font-size="18" font-weight="600" text-anchor="middle">the real machine</text>
  <text x="980" y="700" fill="#7d8590" font-size="13" text-anchor="middle">one action performed</text>
  <text x="980" y="722" fill="#7d8590" font-size="13" text-anchor="middle">capability expires →</text>
  <text x="980" y="742" fill="#58a6ff" font-size="13" text-anchor="middle">access is simply gone</text>

  <!-- AUDIT -->
  <rect x="60" y="620" width="300" height="150" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
  <text x="210" y="656" fill="#e6edf3" font-size="18" font-weight="600" text-anchor="middle">signed audit trail</text>
  <line x1="90" y1="672" x2="330" y2="672" stroke="#30363d"/>
  <text x="80" y="700" fill="#c9d1d9" font-size="13">every GRANT and every DENY,</text>
  <text x="80" y="724" fill="#c9d1d9" font-size="13">which agent, which action,</text>
  <text x="80" y="748" fill="#c9d1d9" font-size="13">which policy, tamper-evident.</text>

  <!-- flows -->
  <!-- agent -> policy -->
  <path d="M290,190 L435,200" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="182" fill="#7d8590" font-size="12" text-anchor="middle">1. request</text>
  <!-- policy -> deny -->
  <path d="M740,200 L815,205" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#arrowRed)"/>
  <!-- policy -> grant -->
  <path d="M590,330 L590,405" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="640" y="372" fill="#3fb950" font-size="12" text-anchor="middle">2. mint</text>
  <!-- grant -> agent (cert handed back) : curved left then down -->
  <path d="M440,470 C360,470 175,360 175,255" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGreen)"/>
  <text x="250" y="400" fill="#3fb950" font-size="12" text-anchor="middle">3. agent gets the scoped cert</text>
  <!-- agent -> enforcement (uses cert) -->
  <path d="M175,255 L175,590 C175,610 300,660 435,675" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="600" fill="#58a6ff" font-size="12" text-anchor="middle">4. connect + run the one command</text>
  <!-- enforcement -> target -->
  <path d="M740,695 L815,695" fill="none" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="778" y="686" fill="#7d8590" font-size="11" text-anchor="middle">5.</text>
  <!-- enforcement -> audit -->
  <path d="M440,720 L365,715" fill="none" stroke="#8957e5" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- policy -> audit (decisions logged) -->
  <path d="M440,300 C300,340 210,470 210,615" fill="none" stroke="#8957e5" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="250" y="520" fill="#8957e5" font-size="11" text-anchor="middle">decisions logged</text>

  <!-- takeaway -->
  <rect x="60" y="810" width="1080" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="600" y="838" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Even a fully compromised agent is bounded to one action, for one minute, fully logged —</text>
  <text x="600" y="858" fill="#8b949e" font-size="14" text-anchor="middle">instead of holding a standing key to your infrastructure.</text>
</svg>
