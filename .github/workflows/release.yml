name: Release

# Runs when you push a version tag like v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build all platforms
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          for t in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            for bin in xgated xgate xgate-gui xgate-policy; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                -ldflags "-s -w" \
                -o "dist/${bin}-${os}-${arch}${ext}" ./cmd/${bin}
            done
          done
          # checksums so users can verify downloads
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          ls -la dist

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## xgate ${{ github.ref_name }}

            **⚠️ Pre-alpha, unaudited. Do not use for real access.** See README.

            ### Quick test (two machines, ~2 minutes)
            1. On machine A: download `xgated-<your-os>` and run `xgated quickstart`
            2. Follow the printed steps (open firewall, start daemon)
            3. On machine B: download `xgate-<your-os>` and run the printed
               `xgate --enroll <token>` command
            4. You get an interactive shell on machine A.

            Verify downloads against `SHA256SUMS.txt`.
