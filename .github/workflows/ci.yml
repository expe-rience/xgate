name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build & test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...

  # Proves the headline feature: one machine, every target, no C toolchain.
  cross-compile:
    name: cross-compile all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: build all platforms
        run: |
          for t in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o dist/xgated-$os-$arch$ext ./cmd/xgated
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o dist/xgate-$os-$arch$ext ./cmd/xgate
            echo "built $t"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: xgate-binaries
          path: dist/

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: test -z "$(gofmt -l .)" || { echo 'run gofmt -w .'; gofmt -l .; exit 1; }
